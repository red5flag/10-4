[build]
# Default target — can be overridden with --target flag or CARGO_BUILD_TARGET env
# target = "aarch64-unknown-linux-gnu"

[target.aarch64-unknown-linux-gnu]
# Debian/Ubuntu: sudo apt install gcc-aarch64-linux-gnu
# openSUSE: sudo zypper install cross-armv7l-gcc13 (uses aarch64-suse-linux-gnu-gcc)
linker = "aarch64-linux-gnu-gcc"

[target.armv7-unknown-linux-gnueabihf]
# For cross-compilation with `cross` tool, this is handled automatically.
# For manual cross-compile with zig: linker = "scripts/armhf-gcc.sh"
# For Debian/Ubuntu: linker = "arm-linux-gnueabihf-gcc"
